spring:
  application:
    name: supplier-sync
  datasource:
    # connectionTimeZone: 드라이버가 LocalDateTime 을 시간대 변환 없이 KST 벽시계 그대로 주고받는다 (docs/ERD.md)
    # rewriteBatchedStatements: Connector/J 가 배치를 다중 문장으로 재작성해 실제 한 번의 왕복으로 보낸다 —
    # 이게 없으면 Hibernate 의 jdbc.batch_size 는 문장별 전송이라 네트워크 이득이 없다(재동기화 UPDATE 배치)
    url: jdbc:mysql://localhost:3306/supplier_sync?connectionTimeZone=Asia/Seoul&rewriteBatchedStatements=true
    # 로컬 docker compose 컨테이너에서만 유효한 값 — 실제 환경이라면 환경변수 등 외부 주입이 원칙
    username: supplier
    password: supplier
    hikari:
      maximum-pool-size: 10  # 기본값과 같지만 결정을 명시 — 병목은 DB가 아니라 외부 공급사 호출
  jpa:
    hibernate:
      # 스키마는 Hibernate 가 엔티티 정의에서 생성·갱신한다. 볼륨으로 유지되는 로컬 데이터 보존을 위해 update
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        # 재동기화는 대부분 표시 속성 UPDATE 라, flush 시 더티 UPDATE 를 JDBC 배치로 묶어 왕복을 줄인다.
        # order_updates 로 같은 테이블 UPDATE 를 모아 배치 효율을 높인다. INSERT 는 IDENTITY(auto_increment)라
        # 키 취득 때문에 배치가 원천 불가능하므로 order_inserts 는 켜지 않는다(효과 없는 설정 배제).
        jdbc:
          batch_size: 50
        order_updates: true
    open-in-view: false

sync:
  # 숙소 목록은 정적 콘텐츠 — 트래픽이 적은 새벽 4시(KST) 하루 1회면 충분. 즉시 반영은 수동 트리거가 담당
  property-cron: "0 0 4 * * *"
  # 저장 시 한 트랜잭션이 잡는 상품 수의 상한 — 커넥션 점유 시간과 영속성 컨텍스트 크기를 유계로 만든다.
  # 근거 있는 출발값이며 실측(대량 카탈로그 동기화 지연)에 따라 조정한다
  chunk-size: 500
  # 청크 트랜잭션의 DB 작업 상한(초). 네트워크 조회는 트랜잭션 밖이라 순수 DB 작업에만 걸린다 —
  # 락 경합·느린 쿼리로 트랜잭션이 매달려 스레드를 잡는 것을 막는 상한. 출발값이며 실측에 따라 조정한다
  chunk-tx-timeout-seconds: 30

supplier:
  # 타임아웃 근거 (docs/INTEGRATION.md): 정상 연결은 수십 ms — 1초 초과 자체가 연결 단계 장애 신호.
  # 연결 수립은 경로와 무관해 하나만 둔다
  connect-timeout-ms: 1000
  # 응답 타임아웃은 경로별 — 검색은 고객이 기다리는 응답이라 빠듯하게, 동기화는 배치라 관대하게.
  # 검색 5초는 응답 분포를 모르는 시점의 출발값(지표 p95/p99 가 쌓이면 조인다), 동기화 10초는
  # 목록 payload 가 크고 지연에 둔감한 배치 성격을 반영한 값
  search-response-timeout-ms: 5000
  sync-response-timeout-ms: 10000
  # 재고·요금 병렬 조회의 동시 호출 상한 — 청크 수는 숙소 수에 비례해 커지므로 상한이 없으면
  # 공급사에 수백 개의 동시 요청이 몰릴 수 있다 (docs/INTEGRATION.md)
  max-concurrent-calls: 16
  # base URL·키는 로컬 Mock 공급사 서버 기준 값 — 실제 연동이라면 환경별 외부 주입이 원칙
  a:
    base-url: http://localhost:9090
    api-key: mock-api-key
  b:
    base-url: http://localhost:9090
    api-key: mock-api-key

resilience4j:
  retry:
    configs:
      search:
        # 검색: 고객이 기다리는 응답이라 첫 시도 + 재시도 1회 — 지연 예산이 곧 재시도 예산
        max-attempts: 2
        # 일시적 실패(타임아웃·5xx·429·공급사 내부오류)만 재시도 — 잘못된 요청·인증 실패는 재시도 무의미
        retry-exception-predicate: com.staysync.resilience.RetryablePredicate
        # 대기 산정 — 실패 종류별 차등(일시 오류 200ms / 한도 초과 1s)에 지수 백오프 + 지터.
        # 스칼라 wait-duration 으로 표현할 수 없는 규칙이라 판별과 같은 클래스 위임 방식을 쓴다
        interval-bi-function: com.staysync.resilience.SupplierRetryIntervalBiFunction
      sync:
        # 동기화: 사용자 응답이 아닌 배치라 지연에 둔감 — 재시도 3회로 복구 확률을 높인다
        max-attempts: 4
        retry-exception-predicate: com.staysync.resilience.RetryablePredicate
        interval-bi-function: com.staysync.resilience.SupplierRetryIntervalBiFunction
    instances:
      A-search:
        base-config: search
      B-search:
        base-config: search
      A-sync:
        base-config: sync
      B-sync:
        base-config: sync
  circuitbreaker:
    configs:
      default:
        # 공급사별 최근 10회 호출 중 실패율 50% 이상이면 open — 청크 수가 적은 현 규모에서
        # 장애가 검색 몇 건 안에 감지되도록 창을 작게 잡는다. 값 조정은 지표가 쌓인 뒤에 한다
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        # open 10초 — 관대한 응답 타임아웃(5초)의 반복 지불을 끊되, 일시 장애면 곧 복구 기회를 준다
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # 느린 호출도 병든 연동이다 — 검색 응답은 가장 느린 청크에 끌려가므로, 타임아웃(5초) 미만이라도
        # 만성적으로 2초를 넘기면 창에 센다. 실패(50%)보다 문턱이 높은 80%인 이유: 느린 호출은 그래도
        # 결과를 주므로, 끊으려면 만성이라는 더 강한 증거를 요구한다. 값은 출발값 — 지표 후 조정
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
    instances:
      A:
        base-config: default
      B:
        base-config: default

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    distribution:
      # 백분위 히스토그램 — 응답 타임아웃을 실측 p95/p99 로 조정하기로 한 결정의 전제 (docs/MONITORING.md).
      # 카디널리티는 공급사 2 × outcome 5 로 작아 비용이 미미하다
      percentiles-histogram:
        supplier.stayproducts.fetch: true

logging:
  level:
    com.staysync: DEBUG
