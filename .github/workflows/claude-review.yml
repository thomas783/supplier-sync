name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 같은 PR에 연달아 푸시하면 이전 리뷰 실행을 취소하고 최신 커밋만 리뷰
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write # Claude GitHub App OIDC 토큰 교환에 필수
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          track_progress: true # 추적 코멘트 생성 — 없으면 CLAUDE_COMMENT_ID 가 비어 sticky comment 게시(update_claude_comment)가 실패함
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 코드 리뷰해주세요. 모든 리뷰 코멘트는 반드시 한국어로 작성합니다.

            ## 리뷰 관점
            1. **정확성·버그**: 로직 오류, 엣지 케이스(빈 값·null·날짜 경계), 예외 처리 누락
            2. **동작 보장**: 멱등성(동기화·저장 작업을 재실행해도 중복 생성이나 상태 변질이 없는가),
               동시성(병렬 공급사 호출과 동시 실행 경로의 race condition, 유니크 제약 충돌 시 처리),
               원자성(트랜잭션 경계가 적절한가, 실패 시 부분 저장 상태로 끝나는 경로는 없는가),
               정합성(저장된 매핑과 응답 조립 결과의 일치, 파생 값과 원천 값의 불일치 가능성)
            3. **보안**: 하드코딩된 크리덴셜·토큰, 로그의 민감정보 노출, 외부 입력 검증
            4. **성능**: N+1 쿼리·불필요한 전체 조회, 외부 공급사 호출의 타임아웃·병렬화·부분 실패 처리,
               대량 데이터 메모리 사용
            5. **테스트**: 신규·변경 로직의 테스트 존재 여부, 경계 케이스 커버리지
            6. **가독성·유지보수성**: 코틀린 관용구, 네이밍, 중복 코드, 불필요한 복잡도
            7. **프로젝트 일관성**: CLAUDE.md의 원칙·컨벤션과 docs/ 설계 문서를 먼저 확인하고, 구현이
               문서화된 결정과 어긋나는 지점을 지적합니다 — 특히 어댑터 경계(어댑터는 내부 id를 모른다),
               교집합 표준 모델, 실패 통일 규칙, 용어집(supplier·property·roomType·StayProduct)

            ## 코멘트 작성 방식
            - 먼저 `gh pr view --comments`로 기존 리뷰 코멘트를 확인하고, 이미 지적된 내용은 반복하지 않습니다
            - 특정 라인의 문제는 `mcp__github_inline_comment__create_inline_comment`(confirmed: true)로 인라인 코멘트 작성
            - 전체 총평은 반드시 `mcp__github_comment__update_claude_comment`로 게시합니다 (sticky comment).
              `gh pr comment`는 허용되지 않으므로 시도하지 않습니다
            - 전체 총평은 요약 → 잘한 점 → 주요 우려사항 순으로 작성
            - 인라인 코멘트는 실질적 문제에 집중하고, 사소한 스타일 지적은 총평에 모아서 짧게 언급
            - 확실하지 않은 지적은 추측임을 명시

          claude_args: |
            --allowedTools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git fetch:*),Bash(git branch:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(rg:*),Bash(ls:*),Bash(find:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(jq:*),Bash(echo:*)"
            --append-system-prompt "모든 출력과 GitHub 코멘트는 반드시 한국어로 작성하세요."
