# 로컬 개발용 MySQL. 테스트는 Testcontainers 가 별도 컨테이너를 스스로 띄운다 (docs/TECH_STACK.md)
services:
  mysql:
    image: mysql:8.4
    environment:
      TZ: Asia/Seoul  # DB 시계도 KST — JVM·JDBC 와 3계층 일치 (docs/ERD.md)
      MYSQL_DATABASE: supplier_sync
      # 로컬 컨테이너에서만 유효한 값 — 실제 환경이라면 환경변수 등 외부 주입이 원칙
      MYSQL_USER: supplier
      MYSQL_PASSWORD: supplier
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"  # 같은 네트워크의 다른 기기에서 접근하지 못하게 루프백에만 바인딩
    healthcheck:
      # 최초 기동은 initdb 로 수십 초가 걸린다 — docker compose up -d --wait 가 이 판정을 기다린다
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql  # 컨테이너를 지워도 데이터 유지 — 초기화는 docker compose down -v 로만


  # ── 전체 스택 (시연용) — docker compose --profile demo up -d --build --wait ──
  # 기본 `docker compose up` 은 MySQL 만 띄운다(로컬 gradlew 개발 흐름 유지).
  # demo 프로필은 Mock 공급사와 본 앱까지 컨테이너로 올려, JDK 없이 Docker 만으로 전체를 실행한다.
  mock:
    build:
      context: .
      target: mock
    image: supplier-sync-mock:local
    profiles: ["demo"]
    environment:
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      # Mock 은 웹 스타터만 의존해 actuator 가 없다 — 실제 픽스처 엔드포인트로 기동을 판정
      test: ["CMD", "curl", "-fs", "http://localhost:9090/a/v1/hotels"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: app
    image: supplier-sync:local
    profiles: ["demo"]
    environment:
      TZ: Asia/Seoul  # JVM 시계 KST — DB·JDBC 와 3계층 일치 (docs/ERD.md)
      # 컨테이너 네트워크에서는 호스트명이 서비스명이다 — localhost 기본값을 덮어쓴다
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/supplier_sync?connectionTimeZone=Asia/Seoul
      SUPPLIER_A_BASE_URL: http://mock:9090
      SUPPLIER_B_BASE_URL: http://mock:9090
    depends_on:
      mysql:
        condition: service_healthy
      mock:
        condition: service_healthy  # 기동 시 1회 동기화가 Mock 을 부르므로 준비된 뒤에 뜬다
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data: